<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Краткое содержание — AI Summarizer</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --accent: #6c5ce7;
      --accent-2: #00cec9;
      --text: #e8eaf0;
      --muted: #8b93a7;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 80% -10%, rgba(108,92,231,0.18), transparent),
                  radial-gradient(900px 500px at 0% 100%, rgba(0,206,201,0.12), transparent),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 760px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      background: #0d0f14;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 14px;
      font-size: 15px;
      line-height: 1.5;
      outline: none;
      transition: border-color .15s ease;
    }
    textarea:focus { border-color: var(--accent); }
    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    select, input[type=password] {
      background: #0d0f14;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }
    button {
      background: linear-gradient(135deg, var(--accent), #8e7bff);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .08s ease, opacity .15s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .out {
      margin-top: 18px;
      background: #0d0f14;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 80px;
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 15px;
    }
    .err { color: #ff7675; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(0,206,201,0.12);
      color: var(--accent-2);
      border: 1px solid rgba(0,206,201,0.25);
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧠 AI Summarizer <span class="badge">v1</span></h1>
    <div class="sub">Вставь текст — получить краткое содержание через нейросеть. Ключ хранится только в браузере.</div>

    <label for="text">Текст для сокращения</label>
    <textarea id="text" placeholder="Вставь сюда длинный текст, статью или транскрипт голосового сообщения..."></textarea>

    <div class="row">
      <label style="margin:0">Провайдер:</label>
      <select id="provider">
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
      </select>
      <input id="key" type="password" placeholder="API ключ" style="flex:1; min-width:180px" />
      <button id="go">Сократить</button>
    </div>
    <div class="hint">Ключ никуда не отправляется. Для OpenAI нужен ключ с <code>sk-...</code>, для Anthropic — с <code>sk-ant-...</code>.</div>

    <div class="out" id="out">Результат появится здесь.</div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const out = $('out');

    async function summarize() {
      const text = $('text').value.trim();
      const key = $('key').value.trim();
      const provider = $('provider').value;
      if (!text) { out.textContent = 'Сначала вставь текст.'; out.classList.add('err'); return; }
      if (!key) { out.textContent = 'Вставь API ключ.'; out.classList.add('err'); return; }
      out.classList.remove('err');
      out.textContent = 'Думаю...';
      $('go').disabled = true;
      try {
        let summary;
        if (provider === 'openai') {
          const res = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
            body: JSON.stringify({
              model: 'gpt-4o-mini',
              messages: [
                { role: 'system', content: 'Ты — ассистент по сокращению текстов. Дай краткое, чёткое резюме на русском языке: 3–5 пунктов, главное сначала.' },
                { role: 'user', content: text }
              ],
              temperature: 0.3
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || 'OpenAI error');
          summary = data.choices[0].message.content;
        } else {
          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': key,
              'anthropic-version': '2023-06-01'
            },
            body: JSON.stringify({
              model: 'claude-3-5-haiku-20241022',
              max_tokens: 500,
              system: 'Ты — ассистент по сокращению текстов. Дай краткое, чёткое резюме на русском языке: 3–5 пунктов, главное сначала.',
              messages: [{ role: 'user', content: text }]
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error?.message || 'Anthropic error');
          summary = data.content[0].text;
        }
        out.textContent = summary;
      } catch (e) {
        out.textContent = 'Ошибка: ' + e.message;
        out.classList.add('err');
      } finally {
        $('go').disabled = false;
      }
    }

    $('go').addEventListener('click', summarize);
    $('text').addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') summarize();
    });
  </script>
</body>
</html>
